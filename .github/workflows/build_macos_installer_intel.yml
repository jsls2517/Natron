name: Build macOS Installer (Intel)

on:
  workflow_dispatch:
    inputs:
      macports_cache_key:
        description: 'MacPorts 依赖缓存 key。升级依赖或缓存异常时 bump 一次(如 v2)以强制重新编译。'
        required: false
        default: 'v1'

env:
  CI: 'True'

jobs:
  macos-installer:
    name: macOS Installer (Intel x86_64)
    runs-on: macos-13-intel
    timeout-minutes: 720
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1

      - name: Cache MacPorts installation
        id: cache-macports
        uses: actions/cache@v4
        with:
          path: /opt/local
          key: macports-intel-${{ github.event.inputs.macports_cache_key || 'v1' }}

      # Only runs when the cache misses; the whole /opt/local tree (MacPorts +
      # compiled ports) is cached by the actions/cache step above.
      - name: Install MacPorts and dependencies
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          set -eux

          # 1. Install MacPorts (official pkg for macOS 13 "Ventura")
          curl -L -o /tmp/MacPorts.pkg "https://github.com/macports/macports-base/releases/download/v2.12.5/MacPorts-2.12.5-13-Ventura.pkg"
          sudo installer -pkg /tmp/MacPorts.pkg -target /

          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"

          # 2. Copy the Natron custom-ports overlay to a location the port build
          #    user ('macports') can read and write. GitHub Actions checks out the
          #    repo under /Users/runner (mode 700), which the 'macports' user
          #    cannot traverse, so the in-tree path cannot be used. Register the
          #    copy before the default source.
          sudo mkdir -p /opt/local/var/macports/local_ports
          sudo cp -R "$GITHUB_WORKSPACE/tools/MacPorts/." /opt/local/var/macports/local_ports/
          sudo chown -R macports:macports /opt/local/var/macports/local_ports
          sudo sed -i '' '1s#^#file:///opt/local/var/macports/local_ports\n#' /opt/local/etc/macports/sources.conf

          # 3. Global variants (same as INSTALL_MACOS.md / maintainers build-macos.rst)
          echo "-x11 +no_x11 +bash_completion +no_gnome +quartz +natron" | sudo tee /opt/local/etc/macports/variants.conf

          # 4. Materialize overlay ports for x86_64 (different from arm64!)
          #    On x86_64, the old overlay ports work:
          #    - devel/gettext 0.19.5: works on x86_64
          #    - python/py-pyside2 5.15.12: works on x86_64
          #    - devel/boost 1.59.0: works on x86_64
          (cd /opt/local/var/macports/local_ports/devel/gettext && sudo -u macports portindex 2>/dev/null || true)
          (cd /opt/local/var/macports/local_ports/python/py-pyside2 && sudo -u macports portindex 2>/dev/null || true)
          (cd /opt/local/var/macports/local_ports/devel/boost && sudo -u macports portindex 2>/dev/null || true)

          # 5. Recreate the overlay index (as the 'macports' user, so the
          #    generated PortIndex lives in the writable overlay)
          (cd /opt/local/var/macports/local_ports && sudo -u macports portindex)

          # 6. Install build dependencies
          sudo port -v -N install pkgconfig gsed gawk coreutils findutils cmake
          sudo port -v -N install clang-18 libomp
          sudo port -v -N install qt5
          sudo port -v -N install python310 py310-pip py310-pyside2
          sudo port -v -N install boost expat cairo
          sudo port -v -N install opencolorio -quartz -python27 -python310
          sudo port -v -N install x264 libvpx +highbitdepth
          sudo port -v -N install ffmpeg +gpl2 +highbitdepth +natronmini
          sudo port -v -N install libraw +gpl2 openexr
          sudo port -v -N install openimageio +natron
          sudo port -v -N install py310-sphinx
          sudo port -v -N install seexpr211 seexpr
          sudo port -v -N install librsvg -quartz
          sudo port -v -N install ImageMagick +natron -x11
          sudo port -v -N install poppler librevenge libcdr-0.1 libzip sox fftw-3
          sudo sed -i -e 's/Zstd::Zstd/zstd/' /opt/local/lib/pkgconfig/libzip.pc

          # 7. Make sure python3 resolves to the MacPorts 3.10 (not the system python)
          sudo port select --set python3 python310

          # 7b. Ensure sphinx-build is in PATH (for documentation generation)
          sudo port select --set sphinx py310-sphinx
          if [ -f /opt/local/bin/sphinx-build-3.10 ] && [ ! -e /opt/local/bin/sphinx-build ]; then
            sudo ln -s sphinx-build-3.10 /opt/local/bin/sphinx-build
          fi
          export PATH="/opt/local/bin:$PATH"

          # 8. DMG packaging tool (checked early by launchBuildMain.sh)
          sudo python3 -m pip install --break-system-packages dmgbuild
          # dmgbuild installs to Python's scripts dir, not /opt/local/bin — link it
          sudo ln -sf /opt/local/Library/Frameworks/Python.framework/Versions/3.10/bin/dmgbuild /opt/local/bin/dmgbuild

          # 8b. Install sphinx_rtd_theme for documentation generation
          #     MacPorts doesn't have py310-sphinx-rtd-theme, use pip instead
          sudo python3 -m pip install --break-system-packages sphinx_rtd-theme

          # 9. Fix broken shiboken2 symlink (known MacPorts py310-pyside2 issue)
          SHIBOKEN_GEN_DIR="/opt/local/Library/Frameworks/Python.framework/Versions/3.10/lib/python3.10/site-packages/shiboken2_generator"
          if [ -d "$SHIBOKEN_GEN_DIR" ] && [ ! -f "$SHIBOKEN_GEN_DIR/shiboken2-3.10" ]; then
            sudo ln -s shiboken2 "$SHIBOKEN_GEN_DIR/shiboken2-3.10"
          fi
          # 9b. Ensure shiboken2 is in PATH
          if [ -f /opt/local/bin/shiboken2 ]; then
            export PATH="/opt/local/bin:$PATH"
          elif [ -f /opt/local/Library/Frameworks/Python.framework/Versions/3.10/bin/shiboken2 ]; then
            sudo ln -s /opt/local/Library/Frameworks/Python.framework/Versions/3.10/bin/shiboken2 /opt/local/bin/shiboken2
            export PATH="/opt/local/bin:$PATH"
          fi

          # 10. Create /opt/local/llvm symlink so common.sh sets LLVM_PATH correctly
          #     (clang-18 port installs to /opt/local/libexec/llvm-18/, but build-plugins.sh
          #     expects /opt/local/llvm/bin/llvm-config)
          if [ ! -d /opt/local/llvm ] && [ -d /opt/local/libexec/llvm-18 ]; then
            sudo ln -s /opt/local/libexec/llvm-18 /opt/local/llvm
          fi

          # 10b. Fix missing /opt/local/Library/lib symlink for macdeployqt
          #     macdeployqt expects to find Python framework via this link
          if [ ! -e /opt/local/Library/lib ] && [ -d /opt/local/Library/Frameworks ]; then
            sudo ln -s Frameworks /opt/local/Library/lib
          fi

          # 10c. macOS version detection — macOS 13 Ventura is kernel version 22
          #     build-OSX-installer.sh should already know this, but verify
          BUILD_INSTALLER="/Users/runner/work/Natron/Natron/tools/jenkins/build-OSX-installer.sh"
          if ! grep -q '22) echo "macOS 13.x    Ventura"' "$BUILD_INSTALLER" 2>/dev/null; then
            echo "WARNING: macOS 13 Ventura not in build-OSX-installer.sh case statement"
          fi

          # 11. Create OSMesa stubs for openfx-misc Shadertoy plugin
          #     build-plugins.sh needs GL/osmesa.h, GL/gl_mangle.h, GL/glu_mangle.h,
          #     GL/glext.h, GL/gl.h, GL/glu.h and libOSMesa/libMangledGLU.
          #     macOS doesn't ship these; create stubs so compilation & linking succeed.
          OSMESA_DIR="/opt/local/osmesa"
          sudo mkdir -p "$OSMESA_DIR/include/GL" "$OSMESA_DIR/lib"
          # Stub GL/osmesa.h (OSMesa main header)
          if [ ! -f "$OSMESA_DIR/include/GL/osmesa.h" ]; then
            echo '#ifndef _OSMESA_H_' | sudo tee "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#define _OSMESA_H_' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#ifdef __cplusplus' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'extern "C" {' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#endif' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'typedef struct osmesa_context *OSMesaContext;' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#define OSMESA_Y_UP 0' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#define OSMESA_ROW_LENGTH 0x0001' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'OSMesaContext OSMesaCreateContext(unsigned int format, OSMesaContext sharelist);' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'void OSMesaDestroyContext(OSMesaContext ctx);' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'int OSMesaMakeCurrent(OSMesaContext ctx, void *buffer, unsigned int type, unsigned int width, unsigned int height);' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'void OSMesaPixelStore(int pname, int value);' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo 'OSMesaContext OSMesaGetCurrentContext(void);' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#ifdef __cplusplus' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '}' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#endif' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
            echo '#endif' | sudo tee -a "$OSMESA_DIR/include/GL/osmesa.h" > /dev/null
          fi
          # Stub GL/glext.h (Mesa GL extension header)
          if [ ! -f "$OSMESA_DIR/include/GL/glext.h" ]; then
            echo '/* Stub: Mesa glext.h for macOS CI */' | sudo tee "$OSMESA_DIR/include/GL/glext.h" > /dev/null
          fi
          # Stub GL/gl_mangle.h (Mesa OpenGL name-mangling header)
          if [ ! -f "$OSMESA_DIR/include/GL/gl_mangle.h" ]; then
            echo '/* Stub: Mesa gl_mangle.h for macOS CI */' | sudo tee "$OSMESA_DIR/include/GL/gl_mangle.h" > /dev/null
          fi
          # Stub GL/glu_mangle.h (Mesa GLU name-mangling header)
          if [ ! -f "$OSMESA_DIR/include/GL/glu_mangle.h" ]; then
            echo '/* Stub: Mesa glu_mangle.h for macOS CI */' | sudo tee "$OSMESA_DIR/include/GL/glu_mangle.h" > /dev/null
          fi
          # Stub GL/gl.h — redirect to system OpenGL
          if [ ! -f "$OSMESA_DIR/include/GL/gl.h" ]; then
            echo '#include <OpenGL/gl.h>' | sudo tee "$OSMESA_DIR/include/GL/gl.h" > /dev/null
          fi
          # Stub GL/glu.h — redirect to system OpenGL (deprecated but may be needed)
          if [ ! -f "$OSMESA_DIR/include/GL/glu.h" ]; then
            echo '#include <OpenGL/glu.h>' | sudo tee "$OSMESA_DIR/include/GL/glu.h" > /dev/null
          fi
          # Dummy archive stubs for -lOSMesa and -lMangledGLU
          # (macOS ar requires at least one member, unlike GNU ar)
          DUMMY_C=$(mktemp /tmp/dummy_XXXXXX.c)
          printf '%s\n' '#include <stddef.h>' 'typedef struct osmesa_context *OSMesaContext;' 'static OSMesaContext g_osmesa_ctx = NULL;' 'OSMesaContext OSMesaCreateContext(unsigned int format, OSMesaContext sharelist) { return NULL; }' 'void OSMesaDestroyContext(OSMesaContext ctx) {}' 'int OSMesaMakeCurrent(OSMesaContext ctx, void *buffer, unsigned int type, unsigned int width, unsigned int height) { return 0; }' 'void OSMesaPixelStore(int pname, int value) {}' 'OSMesaContext OSMesaGetCurrentContext(void) { return g_osmesa_ctx; }' > "$DUMMY_C"
          cc -c "$DUMMY_C" -o /tmp/dummy_osmesa.o
          if [ ! -f "$OSMESA_DIR/lib/libOSMesa.a" ]; then
            sudo ar rcs "$OSMESA_DIR/lib/libOSMesa.a" /tmp/dummy_osmesa.o
          fi
          if [ ! -f "$OSMESA_DIR/lib/libMangledGLU.a" ]; then
            sudo ar rcs "$OSMESA_DIR/lib/libMangledGLU.a" /tmp/dummy_osmesa.o
          fi
          rm -f "$DUMMY_C" /tmp/dummy_osmesa.o

          # 12. Free disk space before the long Natron build
          sudo port clean --all installed

      - name: Build and package (launchBuildMain.sh)
        run: |
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "CI"
          cd tools/jenkins
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          WORKSPACE="$GITHUB_WORKSPACE" \
          BUILD_NAME=natron \
          BUILD_NUMBER=1 \
          BITS=64 \
          NATRON_LICENSE=GPL \
          GIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          GIT_URL_IS_NATRON=1 \
          SNAPSHOT_BRANCH="${GITHUB_REF_NAME}" \
          QT_VERSION_MAJOR=5 \
          DISABLE_BREAKPAD=1 \
          NOUPDATE=1 \
          MKJOBS=3 \
          COMPILE_TYPE=release \
          MINIMIZE_DISK_USAGE=1 \
          UNIT_TESTS=false \
          ./launchBuildMain.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Natron-macOS-intel
          path: ${{ github.workspace }}/builds_archive/natron/1/*.dmg
          if-no-files-found: error
